name: Pull Reporting Data

on:
  # Run once per day at 7am UTC (2am CDT)
  schedule:
    - cron: '0 7 * * *'

  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      client:
        description: 'Client slug (e.g. killergrowth). Leave blank for all.'
        required: false
        default: ''

# Prevent concurrent runs — if a new push triggers while a run is in progress, cancel the older one
concurrency:
  group: pull-and-deploy
  cancel-in-progress: true

jobs:
  pull-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull data — KillerGrowth
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'killergrowth' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          GHL_API_KEY:                 ${{ secrets.GHL_API_KEY }}
          DATAFORSEO_LOGIN:            ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:         ${{ secrets.DATAFORSEO_PASSWORD }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js killergrowth

      - name: Pull data — StewardRight
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'stewardright' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          GHL_API_KEY:                 ${{ secrets.GHL_API_KEY }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js stewardright

      - name: Pull data — Sunflower Plumbing
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'sunflower' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON:       ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_TOKEN:                 ${{ secrets.META_SYSTEM_TOKEN }}
          GHL_API_KEY:                       ${{ secrets.GHL_API_KEY }}
          # Primary: per-client Sheet via directory
          KG_CLIENT_DIRECTORY_SHEET_ID:      ${{ secrets.KG_CLIENT_DIRECTORY_SHEET_ID }}
          # Legacy fallback: old all_clients Sheet (remove once migrated)
          GOOGLE_ADS_SHEET_ID:               ${{ secrets.GOOGLE_ADS_SHEET_ID }}
          # Direct API fallback (blocked until developer token approved)
          GOOGLE_ADS_CLIENT_ID:              ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:          ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:          ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN:        ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID:      ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          PAGESPEED_API_KEY:                 ${{ secrets.PAGESPEED_API_KEY }}
          GBP_REFRESH_TOKEN:                 ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:                     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:                 ${{ secrets.GBP_CLIENT_SECRET }}
          LF_API_KEY:                        ${{ secrets.LF_API_KEY }}
        run: node scripts/build-report.js sunflower

      - name: Pull data — Don's Heating & Air
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'dons-heating' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          GHL_API_KEY:                 ${{ secrets.GHL_API_KEY }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
          LF_API_KEY:                  ${{ secrets.LF_API_KEY }}
        run: node scripts/build-report.js dons-heating

      - name: Pull data — Good to Be Clean
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'good-to-be-clean' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          GHL_API_KEY:                 ${{ secrets.GHL_API_KEY }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js good-to-be-clean

      - name: Pull data — Timnath Painting
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'timnath' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DATAFORSEO_LOGIN:            ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:         ${{ secrets.DATAFORSEO_PASSWORD }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          LF_API_KEY:                  ${{ secrets.LF_API_KEY }}
        run: node scripts/build-report.js timnath

      - name: Pull data — Walnut Valley
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'walnut-valley' }}
        env:
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js walnut-valley

      - name: Pull data — Goff Heating & Air
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'goff' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js goff

      - name: Pull data — 316 Health Insurance
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == '316-health' }}
        env:
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js 316-health

      - name: Pull data — Learning Lab
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'learning-lab' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js learning-lab

      - name: Pull data — Wheatland Construction
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'wheatland' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js wheatland

      - name: Pull data — 360 Painting
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == '360-painting' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js 360-painting

      - name: Pull data — Alex Miller Auctioneer
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'alex-miller' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js alex-miller

      - name: Pull data — Cogan's Woodshop
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'cogans-woodshop' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js cogans-woodshop

      - name: Pull data — IServe Facilities
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'iserve-facilities' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js iserve-facilities

      - name: Pull data — Shaw's Pest Control
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'shaws-pest' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GBP_REFRESH_TOKEN:           ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID:               ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET:           ${{ secrets.GBP_CLIENT_SECRET }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js shaws-pest

      - name: Pull data — Prairie Pots
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'prairie-pots' }}
        env:
          META_SYSTEM_TOKEN:           ${{ secrets.META_SYSTEM_TOKEN }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js prairie-pots

      - name: Pull data — Demo Sales
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'demo-sales' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js demo-sales

      - name: Pull data — Diamond Springs Ranch
        if: ${{ github.event.inputs.client == '' || github.event.inputs.client == 'diamond-springs' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY:           ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/build-report.js diamond-springs

      # Add a step like the one above for each new client.
      # Copy the step, change the client slug and the if condition.

      - name: Build site
        run: node build.js

      - name: Commit updated data files
        run: |
          git config user.name  "KillerGrowth Bot"
          git config user.email "notifications@killergrowth.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: auto-pull reporting data $(date +'%Y-%m')"
          git push

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ./dist --project-name killergrowth-reporting --branch main --commit-dirty=true
