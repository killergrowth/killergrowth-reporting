name: Agent Log Writer

# Two jobs:
#   log-deploy: fires on push to any client site repo (repository_dispatch) or manual trigger
#   email-scan: runs nightly at midnight CDT (05:00 UTC) to scan Tyler B's Gmail

on:
  schedule:
    - cron: '0 5 * * *'   # midnight CDT — email + Zoom meeting scan

  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy or email-scan'
        required: false
        default: 'deploy'
      client:
        description: 'Client slug (deploy mode)'
        required: false
      summary:
        description: 'What was done (deploy mode)'
        required: false
      agent:
        description: 'Agent name (deploy mode)'
        required: false
        default: 'Agent'
      dry_run:
        description: 'Dry run — no writes to Monday (true/false)'
        required: false
        default: 'false'

  repository_dispatch:
    types:
      - agent-log-deploy

jobs:
  log-deploy:
    name: Log Deploy to Monday
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy')

    steps:
      - name: Checkout workspace tools
        uses: actions/checkout@v4
        with:
          repository: killergrowth/killergrowth-openclaw-v2.1
          token: ${{ secrets.KILLERGROWTH_REPO_TOKEN }}
          sparse-checkout: |
            workspace/tools/agent-log-writer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: cd workspace/tools/agent-log-writer && npm install

      - name: Log deploy event
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          CLIENT="${{ github.event.client_payload.client || github.event.inputs.client }}"
          SUMMARY="${{ github.event.client_payload.summary || github.event.inputs.summary }}"
          AGENT="${{ github.event.client_payload.agent || github.event.inputs.agent || 'Agent' }}"

          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          node workspace/tools/agent-log-writer/log-agent-work.mjs \
            --mode deploy \
            --client "$CLIENT" \
            --summary "$SUMMARY" \
            --agent "$AGENT" \
            $DRY_RUN_FLAG

  email-scan:
    name: Nightly Email + Meeting Scan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'email-scan')

    steps:
      - name: Checkout workspace tools
        uses: actions/checkout@v4
        with:
          repository: killergrowth/killergrowth-openclaw-v2.1
          token: ${{ secrets.KILLERGROWTH_REPO_TOKEN }}
          sparse-checkout: |
            workspace/tools/agent-log-writer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: cd workspace/tools/agent-log-writer && npm install

      - name: Scan emails and Zoom summaries
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          node workspace/tools/agent-log-writer/scan-emails.mjs \
            --hours 26 \
            $DRY_RUN_FLAG
